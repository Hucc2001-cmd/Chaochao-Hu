<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>访问统计 · SAB 备考通</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" style="max-width:420px;margin:0 auto;padding:40px 20px;">
    <div class="page-title">📈 访问统计</div>
    <div class="page-sub">统计从 2026 年 9 月上线这个计数器开始的打开次数，之前分享出去的访问记录不到，只能往后看。</div>

    <div class="card" style="text-align:center;padding:32px 16px;">
      <div id="count" style="font-size:48px;font-weight:800;color:var(--primary);">加载中…</div>
      <div class="page-sub" style="margin:6px 0 0;">总打开次数</div>
    </div>

    <button class="btn secondary" onclick="loadCount()">🔄 刷新</button>

    <div class="footer-note">
      数据来自一个免登录的公开计数接口，只统计次数，不采集任何个人信息，
      仅供自己参考，不代表精确的独立访客数（同一个人多次打开也会重复计数）。
    </div>
  </div>

  <script>
    const NAMESPACE = "sab-quiz-f1a237d130cb";
    const KEY = "visits";

    async function loadCount() {
      const el = document.getElementById("count");
      el.textContent = "加载中…";
      try {
        const res = await fetch(`https://abacus.jasoncameron.dev/get/${NAMESPACE}/${KEY}`, { cache: "no-store" });
        if (!res.ok) throw new Error("bad response");
        const data = await res.json();
        el.textContent = (data && typeof data.value === "number") ? data.value.toLocaleString("zh-CN") : "—";
      } catch (e) {
        el.textContent = "获取失败";
      }
    }

    loadCount();
  </script>
</body>
</html>
